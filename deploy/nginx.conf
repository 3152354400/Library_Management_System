# ============================================================
# 图书馆管理系统 - Nginx 站点配置
# 用途：80 端口托管前端 dist + 反向代理后端 API/头像/WebSocket
# 安装位置（服务器）：
#   Ubuntu/Debian : /etc/nginx/sites-available/library.conf
#   CentOS        : /etc/nginx/conf.d/library.conf
# 改完执行: nginx -t && systemctl reload nginx
# ============================================================

server {
    listen 80;
    server_name <服务器公网IP或域名>;   # 改为你的应用服务器公网 IP 或域名
    # ---------- 前端静态文件 ----------
    root /var/www/library;
    index index.html;

    # Vue Router history 模式：找不到文件时回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------- 后端 API 反向代理 ----------
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------- WebSocket（实时通知），必须单独配置 Upgrade ----------
    location /api/ws/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;   # 长连接，防止 1 分钟断线
        proxy_send_timeout 3600s;
    }

    # ---------- 头像等静态资源（后端 wwwroot 托管） ----------
    location /avatars/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
    }

    # 静态资源缓存（前端打包产物带 hash，可放心缓存）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
